name: Sync GN upstream

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: main
            upstream: upstream/main
          - base: starlark
            upstream: upstream/starlark
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.base }}
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add upstream remote
        run: git remote add upstream https://gn.googlesource.com/gn.git || true
      - name: Fetch upstream
        run: git fetch upstream --prune --tags
      - name: Merge upstream
        run: git merge --no-edit "${{ matrix.upstream }}"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync from upstream gn"
          branch: sync/upstream-${{ matrix.base }}
          delete-branch: true
          title: "chore: sync ${{ matrix.base }} from GN upstream"
          body: |
            Automated sync of `${{ matrix.base }}` from https://gn.googlesource.com/gn.git
            Upstream branch: `${{ matrix.upstream }}`
          base: ${{ matrix.base }}
          labels: automated-sync